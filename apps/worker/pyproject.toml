[project]
name = "asapawge-worker"
version = "0.1.0"
description = "ASAPawge GG worker: FastAPI internal API + arq background jobs"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "arq>=0.26",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "cryptography>=44",
  "openai>=1.60",
  "anthropic>=0.40",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
